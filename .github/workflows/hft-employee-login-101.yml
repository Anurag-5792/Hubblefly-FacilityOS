name: HF101 canonical employee login qualification
on:
  push:
    branches:
      - engineering/hft-r1-employee-login-101
permissions:
  contents: read
jobs:
  employee-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify full application source and production build
        run: npm run verify
      - name: Exact-source employee identity policy tests
        run: node --experimental-strip-types --test tests/unit/hft-employee-login-101.test.ts
      - name: Actual disposable canonical PostgreSQL 18 identity lifecycle
        run: python3 tests/postgres/hf101_employee_login_fixture.py

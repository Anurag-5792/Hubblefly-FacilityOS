name: Public Hubblefly colour evidence
on:
  push:
    branches: [engineering/hft-r1-brand-refinement-097]
permissions:
  contents: read
jobs:
  public-palette:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve public website and inspect computed colour styles
        run: |
          node --input-type=module <<'JS'
          import {spawn} from 'node:child_process';
          import {mkdtemp,readFile,rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {setTimeout as sleep} from 'node:timers/promises';
          const tmp=await mkdtemp(join(tmpdir(),'hf-public-brand-'));
          const child=spawn('google-chrome',['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--remote-allow-origins=*','--remote-debugging-port=0','--user-data-dir='+tmp,'about:blank'],{stdio:'ignore'});
          let ws;
          try{
            let port;for(let n=0;n<80;n++){try{port=Number((await readFile(join(tmp,'DevToolsActivePort'),'utf8')).split('\n')[0]);if(port)break;}catch{}await sleep(100);}
            if(!port)throw Error('browser unavailable');
            const tab=(await (await fetch('http://127.0.0.1:'+port+'/json/list')).json()).find(t=>t.type==='page');
            ws=new WebSocket(tab.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.addEventListener('open',r,{once:true});ws.addEventListener('error',j,{once:true});});
            let seq=0;const pending=new Map();ws.addEventListener('message',e=>{const m=JSON.parse(String(e.data));const p=pending.get(m.id);if(p){pending.delete(m.id);m.error?p.reject(Error(JSON.stringify(m.error))):p.resolve(m.result);}});
            const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
            await send('Page.enable');await send('Runtime.enable');await send('Page.navigate',{url:'https://hubblefly.com/'});
            await sleep(12000);
            const expression=`(()=>{const rgb=x=>x.startsWith('rgb')?('#'+x.match(/\\d+/g).slice(0,3).map(n=>Number(n).toString(16).padStart(2,'0')).join('')):x;const sample=e=>{const s=getComputedStyle(e);return {tag:e.tagName,classes:e.className?.toString().slice(0,140),text:e.innerText?.trim().replace(/\\s+/g,' ').slice(0,70),fg:rgb(s.color),bg:rgb(s.backgroundColor),border:rgb(s.borderTopColor),gradient:s.backgroundImage.startsWith('linear-gradient')?s.backgroundImage:null}};const selected=[...document.querySelectorAll('body,header,nav,header a,nav a,main,h1,h2,button,a[class*=btn],a[class*=button],footer,footer a')].filter(e=>e.getBoundingClientRect().width>0).slice(0,100).map(sample);return {url:location.href,title:document.title,styles:[...document.styleSheets].map(s=>s.href).filter(Boolean),root:[...getComputedStyle(document.documentElement)].filter(k=>k.startsWith('--')&&/color|primary|secondary|accent|brand/.test(k)).map(k=>[k,getComputedStyle(document.documentElement).getPropertyValue(k).trim()]).slice(0,50),samples:selected};})()`;
            const r=await send('Runtime.evaluate',{expression,returnByValue:true});const result=r.result.value;
            if(!result||!/^https:\/\/(www\.)?hubblefly\.com\//.test(result.url)||result.samples.length<4)throw Error('official website unavailable');
            console.log('HUBBLEFLY_COMPUTED_PALETTE='+JSON.stringify(result));
          }finally{if(ws)ws.close();child.kill();await sleep(250);await rm(tmp,{recursive:true,force:true,maxRetries:5});}
          JS

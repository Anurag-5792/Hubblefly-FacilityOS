name: W0-03 Database Access Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/platform/db/**"
      - "tests/unit/platform/db/**"
      - "tests/integration/database/**"
      - "scripts/db/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.mts"
      - ".github/workflows/w0-03-database-access.yml"
  push:
    branches: [foundation/wave0-target]
    paths:
      - "src/platform/db/**"
      - "tests/unit/platform/db/**"
      - "tests/integration/database/**"
      - "scripts/db/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.mts"
      - ".github/workflows/w0-03-database-access.yml"

permissions:
  contents: read

jobs:
  database-access:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Verify W0-02 migration foundation
        run: pnpm db:verify

      - name: Database unit tests
        run: pnpm test:db:unit

      - name: PostgreSQL integration tests
        run: pnpm test:db:integration

      - name: TypeScript
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Next.js build
        run: pnpm build

      - name: Repository drift check
        run: |
          git diff --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true

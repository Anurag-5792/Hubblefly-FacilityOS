name: W0-06 Generated Type Commit

on:
  push:
    branches: [foundation/wave0-target]
    paths:
      - ".github/workflows/w0-06-generated-type-commit.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/wave0-target
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Generate canonical DB types from clean local schema
        run: |
          pnpm supabase:start
          pnpm db:reset
          pnpm db:types
      - name: Commit generated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/db/database.types.ts src/platform/db/kysely.types.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(w0-06): regenerate iam database types"
          git push origin HEAD:foundation/wave0-target
      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true

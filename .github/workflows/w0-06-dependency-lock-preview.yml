name: W0-06 Dependency Lock Preview

on:
  push:
    branches: [foundation/wave0-target]
    paths:
      - ".github/workflows/w0-06-dependency-lock-preview.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: foundation/wave0-target
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Generate Supabase auth dependency lock
        run: pnpm add --save-exact --lockfile-only @supabase/ssr@0.12.7 @supabase/supabase-js@2.117.2
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(w0-06): add supabase ssr auth dependencies"
          git push origin HEAD:foundation/wave0-target

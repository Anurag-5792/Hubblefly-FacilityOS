name: HFT FacilityOS Source Verification
on:
  push:
    branches:
      - engineering/hft-r1-stores-foundation
      - engineering/hft-r1-neon-proxy-tls-qualification-010
      - engineering/hft-r1-inventory-intake-088
      - engineering/hft-r1-mis-planning-019
  pull_request:
    branches:
      - main
      - engineering/hft-r1-stores-foundation
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source contracts and production build
        run: npm run verify
      - name: C050 mounted React scope regression (CI-local synthetic P3)
        run: node tests/browser/hft-c050-mounted.mjs
      - name: Live Masters mounted workspace regression (CI-local synthetic records)
        run: node tests/browser/hft-live-masters-mounted.mjs
      - name: Inventory security mounted regression (CI-local synthetic records)
        run: node tests/browser/hft-intake-security-091-mounted.mjs
      - name: MIS mounted read-only planner (CI-local synthetic only)
        env:
          HFT_MIS_CAPTURE_DIR: ${{ runner.temp }}/hft-mis-019
        run: node --experimental-strip-types tests/browser/hft-mis-planning-mounted.mjs
      - name: Upload synthetic MIS visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hf16-mis-019-visual
          path: ${{ runner.temp }}/hft-mis-019/
          if-no-files-found: error
          retention-days: 14
      - name: Production dependency audit (moderate or above)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency tree advisory scan (high or above)
        run: npm audit --audit-level=high

name: W0-09 Audit Approval Holds Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [foundation/wave0-target]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Versions
        run: |
          node --version
          pnpm --version
          pnpm supabase:version
      - name: Clean migrations, generated types and deterministic fingerprint
        run: pnpm db:verify:runtime
      - name: W0-09 governance unit tests
        run: pnpm test:governance:unit
      - name: W0-09 PostgreSQL governance/adversarial/concurrency tests
        run: pnpm test:governance:integration
      - name: W0-08 RLS regression
        run: pnpm test:rls:integration
      - name: W0-08 RLS context unit regression
        run: pnpm test:rls:unit
      - name: W0-07 Authorization regression
        run: pnpm test:authorization:integration
      - name: W0-07 Authorization unit regression
        run: pnpm test:authorization:unit
      - name: W0-06 Auth regression
        run: pnpm test:auth:integration
      - name: W0-06 Auth unit regression
        run: pnpm test:auth:unit
      - name: W0-05 core regression
        run: pnpm test:core:integration
      - name: W0-05 core unit regression
        run: pnpm test:core:unit
      - name: W0-03 DB unit regression
        run: pnpm test:db:unit
      - name: W0-03 DB integration regression
        run: pnpm test:db:integration
      - name: W0-04 platform regression
        run: pnpm test:platform:unit
      - name: Generated DB type diagnostic
        if: always()
        run: git diff -- src/platform/db/database.types.ts src/platform/db/kysely.types.ts || true
      - name: Generated DB type drift
        run: git diff --exit-code -- src/platform/db/database.types.ts src/platform/db/kysely.types.ts
      - name: TypeScript
        run: pnpm typecheck
      - name: Lint with existing warning ceiling
        run: pnpm exec eslint . --max-warnings=40
      - name: Next.js production build
        run: pnpm build
      - name: Legacy Frappe Python compile
        run: python -m compileall -q frappe_app/facility_os/facility_os
      - name: Validate 23 legacy FacilityOS DocTypes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("frappe_app/facility_os/facility_os").glob("facility_os/doctype/*/*.json"))
          if len(files) != 23:
              raise SystemExit(f"Expected 23 FacilityOS DocType JSON files, found {len(files)}")
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
          print("Validated 23 FacilityOS DocType JSON files")
          PY
      - name: W0-09 documentation checks
        run: |
          test -s docs/security/audit.md
          test -s docs/governance/approvals.md
          test -s docs/governance/holds.md
          test -s docs/adr/0003-governance-audit-approval-holds.md
          test -s docs/handover/w0-09-audit-approval-holds.md
          grep -q "append-only" docs/security/audit.md
          grep -q "distinct-human" docs/governance/approvals.md
          grep -q "platform.superuser" docs/governance/approvals.md
          grep -q "no .*override all Holds" docs/governance/holds.md
          grep -q "W0-10" docs/handover/w0-09-audit-approval-holds.md
      - name: Secret-pattern safety check
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          service_role = re.compile("SUPABASE_SERVICE_ROLE_KEY=" + "eyJ")
          postgres_url = re.compile("postgres" + r"(?:ql)?://[^<\s]+:[^<\s]+@")
          known_test_fixtures = {
              ("tests/unit/platform/primitives/errors-state.test.ts", "db.internal/prod"),
              ("tests/unit/governance/governance.test.ts", "db.internal/prod"),
          }
          tracked = subprocess.check_output(["git","ls-files","-z"],text=False).split(b"\0")
          findings = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode())
              if path.as_posix() == "pnpm-lock.yaml":
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError,OSError):
                  continue
              for line_number,line in enumerate(content.splitlines(),start=1):
                  if any(path.as_posix() == p and marker in line for p, marker in known_test_fixtures):
                      continue
                  if service_role.search(line) or postgres_url.search(line):
                      findings.append(f"{path}:{line_number}")
          if findings:
              print("Potential committed secret patterns found at:")
              for finding in findings:
                  print(f"  {finding}")
              raise SystemExit(1)
          print("Secret-pattern safety check: clean")
          PY
      - name: Repository drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true

name: W0-05 Organisation Identifier Verification

on:
  pull_request:
    branches: [main, rebaseline/sdlc-v1]
    paths:
      - "supabase/migrations/**"
      - "src/domains/core/**"
      - "src/platform/db/database.types.ts"
      - "src/platform/db/kysely.types.ts"
      - "scripts/db/**"
      - "tests/unit/core/**"
      - "tests/integration/core/**"
      - "tests/helpers/sequential-uuid-factory.ts"
      - "docs/w0-05-organisation-identifier.md"
      - "package.json"
      - ".github/workflows/w0-05-organisation-identifier.yml"
      - "CONTRIBUTING.md"
      - "README.md"
      - "docs/governance/**"
      - "docs/templates/**"
      - "docs/handover/r1-governance.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [foundation/wave0-target]
    paths:
      - "supabase/migrations/**"
      - "src/domains/core/**"
      - "src/platform/db/database.types.ts"
      - "src/platform/db/kysely.types.ts"
      - "scripts/db/**"
      - "tests/unit/core/**"
      - "tests/integration/core/**"
      - "tests/helpers/sequential-uuid-factory.ts"
      - "docs/w0-05-organisation-identifier.md"
      - "package.json"
      - ".github/workflows/w0-05-organisation-identifier.yml"

permissions:
  contents: read

jobs:
  organisation-identifier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Report tool versions
        run: |
          node --version
          pnpm --version
          pnpm supabase:version
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Clean migration reset, generated types and deterministic fingerprint
        run: pnpm db:verify:runtime

      - name: Upload generated DB types for review
        uses: actions/upload-artifact@v4
        with:
          name: w0-05-generated-db-types
          path: |
            src/platform/db/database.types.ts
            src/platform/db/kysely.types.ts
          if-no-files-found: error
          retention-days: 3

      - name: Generated DB type drift
        run: |
          git diff --exit-code --             src/platform/db/database.types.ts             src/platform/db/kysely.types.ts

      - name: W0-05 unit tests
        run: pnpm test:core:unit
      - name: W0-05 PostgreSQL integration tests
        run: pnpm test:core:integration
      - name: W0-03 database unit regression
        run: pnpm test:db:unit
      - name: W0-03 PostgreSQL integration regression
        run: pnpm test:db:integration
      - name: W0-04 platform regression
        run: pnpm test:platform:unit
      - name: TypeScript
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Next.js build
        run: pnpm build
      - name: Compile legacy Frappe Python sources
        run: python -m compileall -q frappe_app/facility_os/facility_os
      - name: Validate 23 legacy FacilityOS DocType JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("frappe_app/facility_os/facility_os").glob("facility_os/doctype/*/*.json"))
          if len(files) != 23:
              raise SystemExit(f"Expected 23 FacilityOS DocType JSON files, found {len(files)}")
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
          print("Validated 23 FacilityOS DocType JSON files")
          PY
      - name: Repository drift check
        run: |
          git diff --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true
